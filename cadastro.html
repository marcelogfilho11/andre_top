<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="formCadastro">
        <h2>Cadastrar Usuário</h2>
        <input type="text" id="novoUsuario" placeholder="Novo Usuário" required>
        <input type="password" id="novaSenha" placeholder="Nova Senha" required>
        <button type="submit"> Cadastrar </button>
        <button type="button" id="btnVoltarHome" class="btn-secundário"> Voltar </button>
    </form>

    <script src="script.js"></script>
    <script>
        const usuarioLogado = localStorage.getItem('usuarioLogado');
        if(usuarioLogado){
            window.location.href='index.html';
        }
        document.getElementById('btnVoltarHome').addEventListener('click', function(){
            window.location.href='home.html';
        });
    </script>
</body>
</html>
